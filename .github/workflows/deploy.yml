# Deployment workflow for the shipment tracker.
#
# Lab contract: you complete this workflow during the lab. The two marked
# sections below are intentionally empty; the lab guide provides the exact
# steps to paste into them. Fill in AZURE_WEBAPP_NAME with your App Service
# name when you add the deploy step. The application code is correct and
# never changes; this workflow file is the only file you edit.

name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "app-fedid-26gvj6qab24vm"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Azure sign-in
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
